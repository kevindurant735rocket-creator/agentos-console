name: gates
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tools/agent_core.py --check | tail -n 3
      - run: python3 tools/dsp_gate.py | tail -n 3
      - run: python3 tools/safety_gate.py | tail -n 3
      - run: python3 tools/supervise_gate.py | tail -n 3
      - run: python3 tools/gh_gate.py | tail -n 3
      - run: python3 tools/evo_merge_gate.py | tail -n 3
      - run: python3 tools/boss_gate.py | tail -n 3
