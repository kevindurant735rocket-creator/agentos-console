[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-study-cli2"
version = "0.1.0"
description = "Minimal terminal agent CLI skeleton (derived from Aider-AI/aider)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "AgentOS study" }]
keywords = ["agent", "cli", "terminal", "agentos"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agentos-study-cli2 = "main:main"

[tool.setuptools]
py-modules = ["main"]
